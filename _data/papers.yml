# ============================================================================
# Research page content.
#
# Everything on /research/ is generated from this file, so to add a paper you
# add an entry here — you never touch HTML. The page renders the sections in
# the order they appear below, and the sub-navigation at the top of the page
# is built from the sections that have a `nav:` line.
#
# A paper entry can use any of these fields (all optional except `title`):
#
#   title:    the paper title.
#   authors:  list of coauthors, each with a `name` and an optional `url`.
#             Omit for solo-authored work. The page writes the "with ..." line
#             for you, commas and "and" included.
#   journal:  journal or series name — shown as a teal badge.
#   status:   e.g. "submitted", "R&R at ..." — shown as a yellow badge.
#   note:     small grey text after the badges (page numbers, programmes, ...).
#   links:    list of { label, url }, shown as a row separated by dots.
#   abstract: if present, an "Abstract" toggle appears under the links.
#             Use `>-` and indent the text, as in the examples below.
#             For published papers, use the abstract of the published
#             version — journals often rewrite it during revisions.
# ============================================================================

- section: Publications
  anchor: publications
  nav: Publications
  papers:
    - title: The (in)effectiveness of targeted payroll tax reductions
      authors:
        - name: Alessandra Fenizia
          url: https://sites.google.com/site/alessandrafenizia/
        - name: Nicholas Li
          url: https://sites.google.com/view/nicholasli
      journal: The Economic Journal
      links:
        - label: paper
          url: https://luca-citino.github.io/docs/FLC_2025Jan7.pdf
        - label: doi
          url: https://doi.org/10.1093/ej/ueag017
      abstract: >-
        This paper studies the cost-effectiveness of targeted payroll taxes for
        stimulating labor demand. It uses rich administrative data to study the
        effects of an Italian reform that raised social security contributions
        for apprenticeship contracts but granted a substantial discount for firms
        with 9 employees or less. The discount does not increase demand for
        apprenticeship contracts. Instead, it subsidizes inframarginal hiring.
        This reform is not cost-effective. Point estimates imply that each million
        euros of foregone social security contributions supports the employment of
        29 apprentices for one year and no permanent contracts (these estimates
        are not statistically different from zero).

    - title: Manipulation and selection in unemployment insurance
      authors:
        - name: Kilian Russ
        - name: Vincenzo Scrutinio
          url: https://sites.google.com/view/vincenzoscrutinio/home
      journal: The Economic Journal
      links:
        - label: paper
          url: https://luca-citino.github.io/docs/targeted_ui-5.pdf
        - label: doi
          url: https://doi.org/10.1093/ej/ueaf105
      abstract: >-
        In this paper, we study the selection patterns of individuals who manage to
        have their lay-off delayed around an age at lay-off threshold entitling
        them to four additional months of unemployment insurance, that is,
        manipulators. Using administrative data from Italy and bunching techniques,
        we document substantial manipulation around the cut-off and show that
        manipulators are selected on their long-term non-employment risk, but not
        on their moral hazard cost. Finally, we develop a sufficient statistics
        framework to assess how these findings affect optimal unemployment
        insurance duration in the presence of manipulation.

    - title: "Navigating the electric storm: assessing policy responses to Europe's energy shock"
      authors:
        - name: Matteo Alpino
          url: https://sites.google.com/site/alpinomtt/home
        - name: Emanuela Ciapanna
          url: https://scholar.google.com/citations?user=HciEujcAAAAJ&hl=en
        - name: Gabriele Rovigatti
          url: https://sites.google.com/view/gabrielerovigatti/home
      journal: The Electricity Journal
      links:
        - label: CEPR discussion paper
          url: https://cepr.org/system/files/publication-files/DP19981.pdf
        - label: doi
          url: https://doi.org/10.1016/j.tej.2025.107474
      abstract: >-
        We take an off-the-shelf model of the day-ahead electricity market, in the
        spirit of (Reguant, 2019) and use it to study how different emergency
        policy interventions proposed in response to the 2021–2022 European energy
        crisis would feed into short run wholesale electricity price and quantity
        dynamics. Calibrating the model to Italian data, our analysis predicts that
        an EU-wide cap on natural gas prices significantly reduces electricity
        prices, while consumed quantities increase only marginally. A mandated
        reduction in electricity demand during peak hours leads to modest price
        declines, while a national cap on gas prices for electricity generation
        triggers a sharper increase in consumption due to cross-border trade
        incentives. These findings suggest that emergency interventions can mitigate
        the short-term impact of price shocks, though they may also introduce
        inefficiencies in terms of energy consumption and market distortions.

    - title: Costs and benefits of the green transition envisaged in the Italian NRRP
      authors:
        - name: Matteo Alpino
        - name: Federica Zeni
      journal: Energy Policy
      links:
        - label: Bank of Italy OP 720
          url: https://www.bancaditalia.it/pubblicazioni/qef/2022-0720/QEF_720.pdf
        - label: doi
          url: https://doi.org/10.1016/j.enpol.2023.113744
      abstract: >-
        We perform an analysis of the green investments contained in the Italian
        National Recovery and Resilience Plan (NRRP) by comparing environmental
        benefits to the investment cost. We compute the future discounted
        environmental benefits in terms of expected greenhouse gases emission
        reductions using various estimates of the Social Cost of Carbon. Our results
        suggest that several projects would not have a positive net present value,
        unless the discount rate is relatively low and benefits accruing to
        developing countries receive a higher weight. The fact that investments
        under the NRRP are financed via long-term debt helps in bridging the gap
        between costs and environmental benefits. Investments in renewable energy
        are an exception, as their environmental benefits outweigh the cost within
        a short time-frame.

    - title: The impact of Chinese import competition on Italian manufacturing
      authors:
        - name: Andrea Linarello
          url: https://sites.google.com/site/andrealinarello/home
      journal: Review of International Economics
      links:
        - label: Bank of Italy WP 1345
          url: https://www.bancaditalia.it/pubblicazioni/temi-discussione/2021/2021-1345/en_tema_1345.pdf?language_id=1
        - label: doi
          url: https://onlinelibrary.wiley.com/doi/10.1111/roie.12587
      abstract: >-
        This paper documents the effects of increased import competition from China
        on the Italian labor market. In line with recent studies, we take two
        complementary approaches and study both the effects on local labor markets
        and on manufacturing workers. Our analysis shows that the Italian local
        labor markets which were more exposed to Chinese trade by means of their
        industry composition ended up suffering larger manufacturing and overall
        employment losses. Nevertheless, back-of-the-envelope calculations suggest
        that the aggregate effect on total manufacturing employment is modest. At
        the individual level, contrary to what has been documented for many
        developed countries, workers initially employed in more exposed
        manufacturing industries did not suffer long-term losses in terms of lower
        earnings or more discontinuous careers. While they were indeed less likely
        than other similar workers to continue working in manufacturing, they were
        also able to carry out successful transitions toward the non-tradable
        sector, in other areas with better job opportunities.

- section: Working papers
  anchor: working-papers
  nav: Working papers
  papers:
    - title: "Firms in the energy crisis: evidence from 2021–2022"
      authors:
        - name: Matteo Alpino
          url: https://sites.google.com/site/alpinomtt
        - name: Annalisa Frigo
          url: https://annalisafrigo.weebly.com/
      status: submitted
      links:
        - label: paper
          url: https://luca-citino.github.io/docs/acf_may2026.pdf
      abstract: >-
        We quantify how large, unexpected energy-price hikes affect Italian
        industrial firms during the 2021-22 energy crisis. For identification we
        exploit the staggered expiration of fixed-price energy contracts. Contract
        expiration raises firms' average per-unit cost of electricity and gas by 47
        percent and 29 percent, respectively. Electricity demand does not respond,
        while gas consumption falls only in the second half of 2022, with
        substantial heterogeneity across firms. Gas-intensive firms, which account
        for 80% of industrial gas consumption, are almost perfectly inelastic,
        while other firms' price elasticity is -1.3. The estimated heterogeneity
        has important implications for policy design. A simple incidence framework
        shows that subsidies targeted to gas-intensive firms, combined with
        pay-for-reduction schemes for other firms, can focus resources to the most
        exposed consumers while achieving energy savings.

    - title: Wage contracts and financial frictions
      authors:
        - name: Cedomir Malgieri
          url: https://www.cedomirmalgieri.com
      links:
        - label: most recent version
          url: https://cedomirm.github.io/website/MC_JMP.pdf
      abstract: >-
        Financial crises often lead to drastic reductions in firms' access to
        credit, impairing their ability to finance operations. This paper shows
        that firms partly offset the effects of these shocks by optimally adjusting
        their wage bills. We augment a standard model of firm dynamics with
        financial frictions by allowing wages to be set at the firm level within
        long-term employment relationships. In this environment, wages solve a
        dynamic contracting problem that trades off insuring risk-averse workers
        against preserving resources for investment. We validate the model
        predictions on wage dynamics using matched employer-employee data from
        Italy. We find that more constrained firms adjust wages more in response to
        idiosyncratic and aggregate shocks. In addition, firms that suffer the most
        during recessions backload wages by paying workers relatively more in the
        future than today. When matching these statistics with our general
        equilibrium model, we find that these wage adjustments reduce the
        sensitivity of output to financial shocks by 20%. We conclude by studying
        the effects of investment subsidies: firms backload wages more in response
        to the policy, making the policy more effective.

