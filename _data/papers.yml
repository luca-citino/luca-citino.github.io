# ============================================================================
# Research page content.
#
# Everything on /research/ is generated from this file, so to add a paper you
# add an entry here — you never touch HTML. The page renders the sections in
# the order they appear below, and the sub-navigation at the top of the page
# is built from the sections that have a `nav:` line.
#
# A paper entry can use any of these fields (all optional except `title`):
#
#   title:    the paper title.
#   authors:  list of coauthors, each with a `name` and an optional `url`.
#             Omit for solo-authored work. The page writes the "with ..." line
#             for you, commas and "and" included.
#   journal:  journal or series name — shown as a teal badge.
#   status:   e.g. "submitted", "R&R at ..." — shown as a yellow badge.
#   note:     small grey text after the badges (page numbers, programmes, ...).
#   links:    list of { label, url }, shown as a row separated by dots.
#   abstract: if present, an "Abstract" toggle appears under the links.
#             Use `>-` and indent the text, as in the examples below.
# ============================================================================

- section: Publications
