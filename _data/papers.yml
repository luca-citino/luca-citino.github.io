  papers:
    - title: Adverse selection and choice frictions in crop insurance against climate risk
      authors:
        - name: Alessandro Palma
          url: https://sites.google.com/view/alessandropalma/home
        - name: Matteo Paradisi
          url: https://www.matteoparadisi.com/
      links:
        - label: paper
          url: https://luca-citino.github.io/docs/cpp_aug20204.pdf
      abstract: >-
        Despite the increased frequency of extreme weather events and large premium
        subsidies, the use of climate-related crop insurance contracts in European
        countries remains low. We investigate the economic factors behind these low
        coverage rates by linking Italian administrative data on insurance
        purchases and damage claims to high-frequency georeferenced data on weather
        events. We focus on two potential explanations: inefficient pricing of
        insurance contracts due to adverse selection and choice frictions that
        create a wedge between the value of insurance and actual demand. To identify
        adverse selection, we leverage a 2014 reform that lowered the cap for
        premium subsidies in EU countries. This policy caused a reduction in demand
        and an increase in average costs for insurers, indicating adverse selection.
        Regarding frictions, we document through a staggered
        difference-in-differences design that firms are more likely to buy insurance
        when faced with "salient" extreme events, suggesting that farmers are
        imperfectly informed about the value they assign to insurance. We conclude
        by discussing how current price subsidies may be less effective than
        insurance mandates in light of these uncovered market failures.

    - title: "What are the returns to apprenticeships? Evidence from Italy"
      links:
        - label: WorkINPS paper n. 21
          url: https://www.inps.it/docallegatiNP/Mig/InpsComunica/WorkINPS_Papers/21_luglio_2020_aggiornamento_WorkINPS_papers.pdf

    - title: Job reallocation from the 80s to the COVID-19 crisis and beyond
      authors:
        - name: Edoardo Di Porto
        - name: Andrea Linarello
        - name: Francesca Lotti
        - name: Andrea Petrella
        - name: Enrico Sette
      abstract: >-
        This paper examines job reallocation in Italy from the 1980s to 2022,
        comparing the COVID-19 pandemic with previous recessions. Using
        administrative data for the universe of Italian firms, in contrast with
        recent evidence from the U.S. and with other recession episodes in Italy,
        we document that job reallocation decreased during the pandemic. While job
        reallocation between industries increased slightly, within-industry
        movements dropped sharply and substantially, driving aggregate trends. This
        decrease can be attributed to short-time work programs, more widespread
        during COVID-19 than in past recessions and more prevalent in Europe than
        in the U.S.
