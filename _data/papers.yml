  papers:
    - title: "Firms in the energy crisis: evidence from 2021–2022"
      authors:
        - name: Matteo Alpino
          url: https://sites.google.com/site/alpinomtt
        - name: Annalisa Frigo
          url: https://annalisafrigo.weebly.com/
      status: submitted
      links:
        - label: paper
          url: https://luca-citino.github.io/docs/acf_may2026.pdf
      abstract: >-
        We quantify how large, unexpected energy-price hikes affect Italian
        industrial firms during the 2021-22 energy crisis. For identification we
        exploit the staggered expiration of fixed-price energy contracts. Contract
        expiration raises firms' average per-unit cost of electricity and gas by 47
        percent and 29 percent, respectively. Electricity demand does not respond,
        while gas consumption falls only in the second half of 2022, with
        substantial heterogeneity across firms. Gas-intensive firms, which account
        for 80% of industrial gas consumption, are almost perfectly inelastic,
        while other firms' price elasticity is -1.3. The estimated heterogeneity
        has important implications for policy design. A simple incidence framework
        shows that subsidies targeted to gas-intensive firms, combined with
        pay-for-reduction schemes for other firms, can focus resources to the most
        exposed consumers while achieving energy savings.

